# goreleaser cross-compiles the binary for every target and publishes a release
# with checksums. CGO is off everywhere, which is only possible because the
# SQLite driver is pure Go.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./... -race

builds:
  - id: onsuite
    main: ./cmd/onsuite
    binary: onsuite
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF data; the version is stamped in.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Intel Macs have been out of production since 2020; not worth building for.
      - goos: darwin
        goarch: amd64
      # Only amd64 is requested for Windows; arm64 Windows is niche enough to skip for now.
      - goos: windows
        goarch: arm64

archives:
  - id: onsuite
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/DEPLOYING.md
      - docs/onsuite.service

checksum:
  name_template: checksums.txt

# Signs checksums.txt rather than every individual archive: the checksum file
# already covers each archive's integrity, so one signature over it
# authenticates all of them. Keyless (Sigstore): the signing identity comes
# from this workflow's GitHub Actions OIDC token, not a private key this
# project would otherwise have to generate, store and rotate. The signing
# event is recorded in the public Rekor transparency log.
#
# Verify a release with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/iliafrenkel/on-suite/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

changelog:
  use: git
  sort: asc
  # Commit types map to release-note sections; see CONTRIBUTING.md for the
  # full convention. docs:/test: commits are filtered out entirely below —
  # they're not release notes, they're repo maintenance.
  groups:
    - title: New Features
      regexp: '(?i)^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '(?i)^fix(\(.+\))?!?:'
      order: 100
    - title: Improvements
      regexp: '(?i)^(refactor|perf|chore|style)(\(.+\))?!?:'
      order: 200
    - title: Everything Else (for the curious)
      order: 999
  filters:
    exclude:
      - '(?i)^docs(\(.+\))?:'
      - '(?i)^test(\(.+\))?:'
      - Merge pull request
