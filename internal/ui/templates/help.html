{{define "content"}}
<div class="help">
	<nav class="help-nav" aria-label="Help pages">
		<ul>
			{{range .Data.Nav}}
			<li><a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a></li>
			{{end}}
		</ul>
	</nav>
	<article class="help-body">{{.Data.Body}}</article>
</div>
{{end}}
