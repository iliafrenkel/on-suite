{{define "content"}}
<div class="stack">
	<h1>ON Suite</h1>

	{{if .Data.Apps}}
	<div class="home-grid">
		{{range .Data.Apps}}
		{{if not .ComingSoon}}
		<a class="app-card" href="{{.Path}}">
			<div class="app-card-icon">{{icon .ID}}</div>
			<h3>{{.Name}}</h3>
			<p class="faint">{{.Summary}}</p>
		</a>
		{{end}}
		{{end}}
	</div>
	{{else}}
	<p class="dim">No applications are registered in this build yet.</p>
	{{end}}

	{{with .Data.ComingSoonNames}}
	<p class="faint home-coming-soon">More apps coming: {{.}}.</p>
	{{end}}
</div>
{{end}}
