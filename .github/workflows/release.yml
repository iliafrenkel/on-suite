name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the release and upload artefacts
  id-token: write # required for cosign's keyless signing (GitHub OIDC)
  packages: write # required to push the docker image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history, so a shallow clone
          # produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3

      # goreleaser's docker builder shells out to `docker buildx build`, so
      # buildx needs to already be set up, with QEMU for the arm64 image
      # (this runner is amd64).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
